# Kubernetes Deployment Configuration
# This file tells Kubernetes how to run your Flask app

apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-myapp-deployment
  labels:
    app: k8s-myapp
spec:
  # Number of replicas (copies) of your app
  # Start with 2 for high availability
  replicas: 2
  
  # Selector to identify which pods belong to this deployment
  selector:
    matchLabels:
      app: k8s-myapp
  
  # Template for creating pods
  template:
    metadata:
      labels:
        app: k8s-myapp
    spec:
      containers:
      - name: k8s-myapp
        # Docker image to use (you'll build this)
        image: k8s-myapp:latest
        
        # Pull policy - use IfNotPresent for local images
        imagePullPolicy: IfNotPresent
        
        # Port the container exposes
        ports:
        - containerPort: 3000
          name: http
        
        # Resource limits (prevents one pod from using all resources)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5


