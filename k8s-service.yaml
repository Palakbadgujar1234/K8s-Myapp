# Kubernetes Service Configuration
# This exposes your app to the outside world

apiVersion: v1
kind: Service
metadata:
  name: k8s-myapp-service
  labels:
    app: k8s-myapp
spec:
  # Type of service
  # NodePort exposes the service on each Node's IP at a static port
  type: NodePort
  
  # Selector to find the pods
  selector:
    app: k8s-myapp
  
  # Ports configuration
  ports:
  - port: 3000          # Port the service listens on
    targetPort: 3000    # Port the container listens on
    nodePort: 30000     # Port exposed on the node (30000-32767 range)
    protocol: TCP
    name: http

